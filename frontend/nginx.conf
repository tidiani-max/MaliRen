server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;           # media uploads (API enforces MAX_UPLOAD_MB)

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Add Strict-Transport-Security and a tuned Content-Security-Policy at your TLS-terminating proxy in production.

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # API, Swagger UI and health are served by the Express container.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /docs/ { proxy_pass http://api:4000; proxy_set_header Host $host; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # Single-page app: unknown paths fall back to index.html (client-side routing).
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
